<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR 呼吸球</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --tb:#17C9AF;--tm:#12A08C;--td:#0D7A6B;
  --tp:#A8F5EA;--tbg:#071F1C;--ts:#0B2E29;
  --t1:#D4F5EF;--t2:#7ED8CB;--t3:#3D8F83;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--t1);-webkit-tap-highlight-color:transparent;user-select:none;}

/* 啟動畫面 */
#splash{position:fixed;inset:0;background:var(--tbg);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .5s ease;}
#splash.hide{opacity:0;pointer-events:none;}
.s-ball{width:100px;height:100px;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#A8F5EA 0%,#5DE5CE 22%,#12A08C 55%,#0D7A6B 85%,#064038 100%);
  box-shadow:0 0 40px rgba(23,201,175,.5),0 0 80px rgba(23,201,175,.2);
  animation:sp 2.4s ease-in-out infinite;}
@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.s-title{font-size:22px;font-weight:700;color:var(--tb);}
.s-desc{font-size:14px;color:var(--t3);text-align:center;line-height:1.7;max-width:260px;}
#go-btn{padding:14px 40px;border-radius:30px;border:1.5px solid var(--tm);
  background:var(--td);color:var(--tp);font-size:16px;font-weight:600;cursor:pointer;
  box-shadow:0 0 24px rgba(18,160,140,.35);}
#go-btn:active{transform:scale(.96);}
#err{font-size:13px;color:#E24B4A;text-align:center;max-width:280px;line-height:1.6;display:none;}

/* HUD — 必須保留給 dom-overlay 使用
   觸控穿透原則：整個 HUD pointer-events:none
   只有按鈕區域 pointer-events:auto             */
#hud{
  position:fixed;inset:0;z-index:10;
  display:none;                        /* AR 啟動後改 block */
  pointer-events:none;                 /* 空白處觸控穿透到 XR session */
}
#hud.on{display:block;}

/* 頂部資訊列 */
#top-bar{
  position:absolute;top:0;left:0;right:0;
  padding:safe-area-inset-top 20px 0;
  padding-top:max(env(safe-area-inset-top,0px),20px);
  display:flex;align-items:center;justify-content:space-between;
}
#top-title{font-size:14px;font-weight:600;color:var(--tb);
  text-shadow:0 1px 8px rgba(0,0,0,.8);}
#top-status{font-size:12px;color:var(--t2);
  text-shadow:0 1px 8px rgba(0,0,0,.8);}

/* 語音條 */
#vbar{
  position:absolute;top:68px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  background:rgba(11,46,41,.9);border:.5px solid #0F4A42;border-radius:20px;
  padding:5px 14px;white-space:nowrap;
  opacity:0;transition:opacity .35s;pointer-events:none;
}
#vbar.on{opacity:1;}
.vw{display:flex;align-items:flex-end;gap:2px;height:12px;}
.vw span{display:block;width:3px;border-radius:2px;background:var(--tb);
  animation:vwa .75s ease-in-out infinite;}
.vw span:nth-child(1){height:5px;animation-delay:0s}
.vw span:nth-child(2){height:10px;animation-delay:.15s}
.vw span:nth-child(3){height:5px;animation-delay:.3s}
@keyframes vwa{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}
#vt{font-size:12px;color:var(--t2);letter-spacing:.04em;}

/* 掃描提示 */
#scan{
  position:absolute;bottom:210px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:opacity .4s;
}
#scan.hide{opacity:0;pointer-events:none;}
.s-ring{width:64px;height:64px;border-radius:50%;
  border:2.5px solid var(--tb);
  animation:srp 1.6s ease-in-out infinite;}
@keyframes srp{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.2);opacity:.4}}
#scan p{font-size:13px;color:var(--t2);text-shadow:0 1px 8px rgba(0,0,0,.9);letter-spacing:.04em;}

/* 呼吸狀態 */
#breath{
  position:absolute;bottom:175px;left:0;right:0;
  text-align:center;opacity:0;transition:opacity .5s;
}
#breath.on{opacity:1;}
#b-phase{font-size:30px;font-weight:700;color:var(--tb);
  text-shadow:0 0 24px rgba(23,201,175,.8),0 2px 8px rgba(0,0,0,.7);}
#b-sub{font-size:13px;color:var(--t2);text-shadow:0 1px 6px rgba(0,0,0,.8);}

/* 輪次點 */
#dots{
  position:absolute;bottom:150px;left:0;right:0;
  display:flex;gap:7px;justify-content:center;
  opacity:0;transition:opacity .4s;
}
#dots.on{opacity:1;}
.rd{width:8px;height:8px;border-radius:50%;background:rgba(15,74,66,.9);transition:all .4s;}
.rd.done{background:var(--tb);}
.rd.cur{background:var(--tb);box-shadow:0 0 10px var(--tb);}

/* 底部按鈕列 — 只有這裡 pointer-events:auto */
#btns{
  position:absolute;bottom:0;left:0;right:0;
  padding:0 20px max(env(safe-area-inset-bottom,0px),28px);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  pointer-events:auto;        /* ← 這裡接收按鈕點擊 */
}
.btn-row{display:flex;gap:10px;align-items:center;}
.vbtn{display:flex;align-items:center;gap:6px;padding:0 14px;height:44px;
  border-radius:22px;border:1.5px solid rgba(15,74,66,.9);
  background:rgba(7,31,28,.85);cursor:pointer;transition:all .2s;}
.vbtn.on{border-color:var(--tm);background:rgba(11,46,41,.9);}
.vbtn-lbl{font-size:12px;color:var(--t3);transition:color .2s;}
.vbtn.on .vbtn-lbl{color:var(--tp);}
.abtn{height:44px;padding:0 28px;border-radius:22px;
  border:1.5px solid var(--tm);background:rgba(13,122,107,.9);
  color:var(--tp);font-size:15px;font-weight:600;cursor:pointer;
  box-shadow:0 0 20px rgba(18,160,140,.3);}
.abtn:active{transform:scale(.96);}
.abtn.sec{background:rgba(7,31,28,.85);border-color:rgba(15,74,66,.9);color:var(--t3);box-shadow:none;}
.tip{font-size:11px;color:var(--t3);letter-spacing:.04em;text-align:center;
  text-shadow:0 1px 6px rgba(0,0,0,.9);}

/* 退出鈕 — pointer-events:auto 個別設定 */
#x-btn{
  position:absolute;top:max(env(safe-area-inset-top,0px),16px);right:16px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(7,31,28,.85);border:1px solid rgba(15,74,66,.8);
  color:var(--t3);font-size:18px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;pointer-events:auto;    /* ← 個別允許點擊 */
}
</style>
</head>
<body>

<!-- 啟動畫面 -->
<div id="splash">
  <div class="s-ball"></div>
  <div class="s-title">AR 呼吸球</div>
  <div class="s-desc">開啟相機，掃描桌面或地板，<br>點擊螢幕放置呼吸球</div>
  <button id="go-btn" onclick="startAR()">開啟相機 AR</button>
  <div id="err"></div>
</div>

<!-- HUD（dom-overlay 根節點）-->
<div id="hud">

  <div id="top-bar">
    <span id="top-title">ADHD 同調呼吸</span>
    <span id="top-status">掃描平面中…</span>
  </div>

  <div id="vbar">
    <div class="vw"><span></span><span></span><span></span></div>
    <span id="vt"></span>
  </div>

  <div id="scan">
    <div class="s-ring"></div>
    <p>將手機對準桌面，慢慢左右移動</p>
  </div>

  <div id="breath">
    <div id="b-phase">—</div>
    <div id="b-sub"></div>
  </div>

  <div id="dots"></div>

  <div id="btns">
    <div class="btn-row">
      <button class="vbtn on" id="vbtn" onclick="toggleVoice()">
        <span id="vi" style="font-size:15px">🔊</span>
        <span class="vbtn-lbl" id="vl">語音開</span>
      </button>
      <button class="abtn" id="mbtn" onclick="mainAction()" style="display:none">開始呼吸</button>
      <button class="abtn sec" id="rbtn" onclick="resetBall()" style="display:none">重新放置</button>
    </div>
    <div class="tip">同調呼吸 — 吸氣 5 秒 · 吐氣 6 秒，共 5 輪</div>
  </div>

  <button id="x-btn" onclick="exitAR()">✕</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ══════════════════════════════════════════════════
   AR 呼吸球 v4
   關鍵架構：
   1. dom-overlay 必須保留（immersive-ar 中唯一能顯示 DOM 的方式）
   2. HUD 根節點 pointer-events:none，空白處觸控穿透
   3. 按鈕列和退出鈕個別 pointer-events:auto
   4. 放置用 XR controller select 事件（非 canvas click）
   5. 球體用 MeshStandardMaterial（比 Physical 快）
   ══════════════════════════════════════════════════ */

const PHASES=[{n:'吸氣',t:5},{n:'吐氣',t:6}];
const ROUNDS=5;
const VS={
  intro:['歡迎開始同調呼吸練習。','跟著球的節奏，吸氣五秒，吐氣六秒。'],
  ph:{'吸氣':'吸氣','吐氣':'吐氣'},
  mid:[null,'很好，繼續保持。','讓呼吸更自然。','感受氣息流動。','最後一輪。'],
  end:'練習完成，帶著這份平靜繼續你的一天。'
};

/* 狀態 */
let scene,camera,renderer;
let xrSession=null,refSpace=null,hitSrc=null,hitSrcRequested=false,xrCtrl=null;
let reticle=null,ball=null;
let placed=false,lastPose=null;
let curS=1,tgtS=1;
let running=false,rdone=0,pidx=0,sleft=0,tk=null;
let voiceOn=true,pvox=null;

/* DOM */
const $ = id => document.getElementById(id);
const hud=$('hud'),scan=$('scan'),status=$('top-status');
const bphase=$('b-phase'),bsub=$('b-sub'),bdsp=$('breath'),dotsEl=$('dots');
const mbtn=$('mbtn'),rbtn=$('rbtn');
const vbar=$('vbar'),vt=$('vt');
const synth=window.speechSynthesis;

/* 語音初始化 */
(()=>{
  if(!synth)return;
  const pick=()=>{
    const vs=synth.getVoices();
    pvox=vs.find(v=>v.lang==='zh-TW'&&v.name.includes('Meijia'))
        ||vs.find(v=>v.lang==='zh-TW'&&v.name.includes('Ting'))
        ||vs.find(v=>v.lang==='zh-TW')
        ||vs.find(v=>v.lang.startsWith('zh'))||null;
  };
  synth.getVoices().length?pick():synth.addEventListener('voiceschanged',pick,{once:true});
})();

let bTimer=null;
function speak(txt,cb){
  if(!voiceOn||!synth||!txt){cb&&setTimeout(cb,0);return;}
  synth.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='zh-TW';if(pvox)u.voice=pvox;u.rate=.80;u.volume=1;
  vt.textContent=txt;vbar.classList.add('on');
  clearTimeout(bTimer);
  const done=()=>{vbar.classList.remove('on');cb&&cb();};
  u.onend=done;u.onerror=done;
  bTimer=setTimeout(()=>vbar.classList.remove('on'),txt.length*200+1500);
  synth.speak(u);
}
function seq(lines,cb){
  if(!lines||!lines.length){cb&&cb();return;}
  const[h,...t]=lines;
  if(!h){seq(t,cb);return;}
  speak(h,()=>t.length?setTimeout(()=>seq(t,cb),350):cb&&cb());
}
function toggleVoice(){
  voiceOn=!voiceOn;
  $('vbtn').classList.toggle('on',voiceOn);
  $('vi').textContent=voiceOn?'🔊':'🔇';
  $('vl').textContent=voiceOn?'語音開':'語音關';
  if(!voiceOn){synth&&synth.cancel();vbar.classList.remove('on');}
}

/* ══ startAR ══ */
async function startAR(){
  if(!navigator.xr){err('請使用 Android Chrome 開啟');return;}
  const ok=await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){err('裝置不支援 WebXR AR');return;}

  initThree();

  try{
    xrSession=await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      /* dom-overlay 必須保留，否則 HUD 在 immersive 模式下不可見 */
      optionalFeatures:['dom-overlay','light-estimation'],
      domOverlay:{root:hud}
    });
  }catch(e){err('AR 啟動失敗：'+e.message);return;}

  $('splash').classList.add('hide');
  hud.classList.add('on');

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(xrSession);
  xrSession.addEventListener('end',onEnd);

  refSpace=await xrSession.requestReferenceSpace('local');
  /* hitTestSource 改在每幀的 frame() 裡面延遲初始化（Three.js 官方範例做法）
     避免 session 建立時序問題導致 hit test 靜默失敗 */

  /* XR controller select = 手機點擊 AR 畫面的空白區域 */
  xrCtrl=renderer.xr.getController(0);
  xrCtrl.addEventListener('select',onSel);
  scene.add(xrCtrl);

  renderer.setAnimationLoop(frame);
}

function err(msg){
  $('err').textContent=msg;$('err').style.display='block';
  $('go-btn').style.display='none';
}

/* ══ Three.js ══ */
function initThree(){
  scene=new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff,1.1));
  const d=new THREE.DirectionalLight(0xffffff,1.4);d.position.set(2,6,3);scene.add(d);
  const f=new THREE.DirectionalLight(0x88FFEE,.5);f.position.set(-3,2,-2);scene.add(f);

  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,20);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled=true;
  renderer.outputEncoding=THREE.sRGBEncoding;
  /* canvas z-index 低於 HUD */
  renderer.domElement.style.cssText='position:fixed;top:0;left:0;z-index:1;';
  document.body.appendChild(renderer.domElement);

  /* reticle */
  const rg=new THREE.RingGeometry(.05,.08,32);
  rg.rotateX(-Math.PI/2);
  reticle=new THREE.Mesh(rg,new THREE.MeshBasicMaterial(
    {color:0x17C9AF,side:THREE.DoubleSide,transparent:true,opacity:.85}));
  reticle.matrixAutoUpdate=false;
  reticle.visible=false;
  scene.add(reticle);

  makeBall();

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
}

function makeBall(){
  if(ball){scene.remove(ball);ball=null;}
  const g=new THREE.Group();

  /* ── 用 Canvas 貼圖畫高光，完全不產生 3D 凸出 ── */
  const cvs=document.createElement('canvas');
  cvs.width=cvs.height=512;
  const ctx=cvs.getContext('2d');

  /* 底色：深湖水綠 */
  const bg=ctx.createRadialGradient(256,256,10,256,256,256);
  bg.addColorStop(0,'#1ED4B8');
  bg.addColorStop(.5,'#0F9080');
  bg.addColorStop(1,'#074A40');
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,512,512);

  /* 左上高光橢圓 */
  const hl=ctx.createRadialGradient(155,145,0,155,145,130);
  hl.addColorStop(0,'rgba(210,255,248,0.72)');
  hl.addColorStop(.45,'rgba(180,245,235,0.35)');
  hl.addColorStop(1,'rgba(180,245,235,0)');
  ctx.save();
  ctx.scale(1,.65);
  ctx.fillStyle=hl;
  ctx.beginPath();
  ctx.arc(155,145/0.65,130,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* 右下反光 */
  const rl=ctx.createRadialGradient(340,340,0,340,340,80);
  rl.addColorStop(0,'rgba(23,201,175,0.25)');
  rl.addColorStop(1,'rgba(23,201,175,0)');
  ctx.fillStyle=rl;
  ctx.beginPath();ctx.arc(340,340,80,0,Math.PI*2);ctx.fill();

  const tex=new THREE.CanvasTexture(cvs);

  /* 外球：套貼圖 */
  const om=new THREE.MeshStandardMaterial({
    map:tex,
    emissive:new THREE.Color(0x0A4A3C),emissiveIntensity:.35,
    metalness:.10,roughness:.15,
    transparent:true,opacity:.92});
  const ob=new THREE.Mesh(new THREE.SphereGeometry(.10,48,48),om);
  ob.name='outer';g.add(ob);

  /* 內核發光 */
  const cm=new THREE.MeshStandardMaterial({
    color:0x5DE5CE,emissive:0x17C9AF,emissiveIntensity:1.1,
    transparent:true,opacity:.48,roughness:0,metalness:0});
  const cb=new THREE.Mesh(new THREE.SphereGeometry(.050,32,32),cm);
  cb.name='core';g.add(cb);

  /* 外發光殼（BackSide，比外球略大，產生邊緣光暈）*/
  g.add(new THREE.Mesh(new THREE.SphereGeometry(.110,16,16),
    new THREE.MeshBasicMaterial({
      color:0x17C9AF,transparent:true,opacity:.05,side:THREE.BackSide})));

  /* 地面陰影 */
  const sg=new THREE.CircleGeometry(.09,32);sg.rotateX(-Math.PI/2);
  const sh=new THREE.Mesh(sg,
    new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.18}));
  sh.position.y=-.101;g.add(sh);

  g.visible=false;scene.add(g);ball=g;
}

/* ══ XR select 事件（空白處點擊）══ */
function onSel(){
  if(!placed&&lastPose) place();
}

function place(){
  const p=new THREE.Vector3(),q=new THREE.Quaternion();
  new THREE.Matrix4().fromArray(lastPose.transform.matrix).decompose(p,q,new THREE.Vector3());
  ball.position.copy(p);
  ball.position.y+=.10;
  ball.visible=true;placed=true;
  curS=0;tgtS=1;ball.scale.setScalar(0);
  scan.classList.add('hide');
  mbtn.style.display=rbtn.style.display='block';
  status.textContent='點擊「開始呼吸」';
  buildDots();
}

function resetBall(){
  if(running)stopBreath();
  placed=false;lastPose=null;ball.visible=false;
  mbtn.style.display=rbtn.style.display='none';
  bdsp.classList.remove('on');dotsEl.classList.remove('on');
  scan.classList.remove('hide');
  status.textContent='掃描平面中…';
  bphase.textContent='—';bsub.textContent='';tgtS=1;
}

/* ══ XR 每幀 ══ */
function frame(t,xrf){
  if(!xrf)return;

  /* ── hit test source 延遲初始化（官方 Three.js 範例做法）──
     在 session 內的第一幀才申請，確保時序正確             */
  if(!hitSrcRequested){
    hitSrcRequested=true;
    xrSession.requestReferenceSpace('viewer').then(vs=>{
      xrSession.requestHitTestSource({space:vs}).then(src=>{
        hitSrc=src;
      }).catch(e=>console.warn('hitTestSource 失敗:',e));
    });
    xrSession.addEventListener('end',()=>{
      hitSrcRequested=false; hitSrc=null;
    });
  }

  if(hitSrc&&!placed){
    const hits=xrf.getHitTestResults(hitSrc);
    if(hits.length){
      lastPose=hits[0].getPose(refSpace);
      reticle.visible=true;
      reticle.matrix.fromArray(lastPose.transform.matrix);
      status.textContent='偵測到平面，點擊放置';
    }else{
      reticle.visible=false;lastPose=null;
      status.textContent='掃描平面中…';
    }
  }

  if(ball&&ball.visible){
    const spd=running?.018:.09;
    curS+=(tgtS-curS)*spd;
    ball.scale.setScalar(curS);
    const core=ball.getObjectByName('core');
    if(core)core.material.emissiveIntensity=.7+.4*Math.sin(t*.001*1.2);
    ball.rotation.y+=.003;
  }

  renderer.render(scene,camera);
}

/* ══ 呼吸 ══ */
function buildDots(){
  dotsEl.innerHTML='';
  for(let i=0;i<ROUNDS;i++){
    const d=document.createElement('div');
    d.className='rd';d.id='rd'+i;dotsEl.appendChild(d);
  }
}
function updDots(){
  for(let i=0;i<ROUNDS;i++){
    const d=$('rd'+i);if(!d)continue;
    d.className='rd'+(i<rdone?' done':i===rdone?' cur':'');
  }
}

function mainAction(){running?stopBreath():startBreath();}

function startBreath(){
  running=true;rdone=0;pidx=0;
  mbtn.textContent='停止';rbtn.style.display='none';
  bdsp.classList.add('on');dotsEl.classList.add('on');updDots();
  seq(VS.intro,()=>{if(running)nxt();});
}
function stopBreath(){
  running=false;synth&&synth.cancel();vbar.classList.remove('on');clearInterval(tk);
  mbtn.textContent='開始呼吸';rbtn.style.display='block';
  bphase.textContent='已暫停';bsub.textContent='按開始繼續';
  status.textContent='已暫停';tgtS=1;
}
function nxt(){
  if(!running)return;
  if(pidx>=PHASES.length){
    pidx=0;rdone++;updDots();
    if(rdone>=ROUNDS){done();return;}
    const m=VS.mid[rdone];
    if(m&&voiceOn){speak(m,()=>{if(running)ph();});return;}
  }
  ph();
}
function ph(){
  if(!running)return;
  const p=PHASES[pidx];sleft=p.t;
  bphase.textContent=p.n;
  bsub.textContent=p.n==='吸氣'?'用鼻子緩緩吸入':'用嘴慢慢吐出';
  tgtS=p.n==='吸氣'?1.55:.70;
  const ob=ball&&ball.getObjectByName('outer');
  if(ob){
    ob.material.color.setHex(p.n==='吸氣'?0x17C9AF:0x0D7A6B);
    ob.material.emissive.setHex(p.n==='吸氣'?0x0D7A6B:0x042820);
    ob.material.emissiveIntensity=p.n==='吸氣'?.5:.25;
  }
  const w=VS.ph[p.n];if(w)speak(w);
  clearInterval(tk);
  tk=setInterval(()=>{sleft--;if(sleft<=0){clearInterval(tk);pidx++;setTimeout(()=>{if(running)nxt();},100);}},1000);
}
function done(){
  running=false;clearInterval(tk);
  mbtn.textContent='再來一次';rbtn.style.display='block';
  bphase.textContent='完成';bsub.textContent='很棒，保持這份平靜';
  status.textContent='練習完成';tgtS=1.08;
  for(let i=0;i<ROUNDS;i++){const d=$('rd'+i);if(d)d.className='rd done';}
  if(voiceOn)setTimeout(()=>speak(VS.end),600);
  setTimeout(()=>{if(!running)tgtS=1;},2200);
}

/* ══ 退出 ══ */
function exitAR(){xrSession?xrSession.end():onEnd();}
function onEnd(){
  running=false;synth&&synth.cancel();
  renderer&&(renderer.setAnimationLoop(null),renderer.domElement?.remove());
  hud.classList.remove('on');
  $('splash').classList.remove('hide');
  placed=false;lastPose=null;hitSrc=null;hitSrcRequested=false;
  xrSession=null;xrCtrl=null;
}

/* 啟動檢查 */
window.addEventListener('DOMContentLoaded',()=>{
  if(!navigator.xr){
    $('go-btn').textContent='⚠ 需要 Android Chrome';
    $('err').style.display='block';
    $('err').textContent='請用 Android Chrome 開啟此頁面';
  }
});
</script>
